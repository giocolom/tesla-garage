<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flashblack Command Center</title>
  <style>
    :root {
      --bg-color: #07090e;
      --card-bg: rgba(18, 22, 32, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #9ba3af;
      --tesla-red: #e82127;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #141928 0%, #07090e 70%);
      color: var(--text-main);
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
      transition: box-shadow 0.3s ease;
    }

    /* Flash Screen Pulse Effect */
    body.flash-active {
      box-shadow: inset 0 0 50px var(--flash-color, var(--accent-blue));
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Centered Header */
    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tesla-logo {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0 0 12px rgba(232, 33, 39, 0.5));
    }

    .car-title {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    /* Enlarged Widget Panel */
    .widget-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .widget-time-block {
      display: flex;
      flex-direction: column;
    }

    .widget-time {
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .widget-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
      text-transform: capitalize;
    }

    .widget-weather {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .widget-weather strong {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* Main Scenarios (DOMINANT) */
    .scenarios-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-scenario {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .btn-scenario::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 6px;
    }

    .btn-apri {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.16) 0%, var(--card-bg) 100%);
      border-color: rgba(16, 185, 129, 0.3);
    }
    .btn-apri::before { background-color: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }

    .btn-chiudi {
      background: linear-gradient(90deg, rgba(239, 68, 68, 0.16) 0%, var(--card-bg) 100%);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .btn-chiudi::before { background-color: var(--accent-red); box-shadow: 0 0 12px var(--accent-red); }

    .btn-scenario.sending {
      transform: scale(0.98);
      filter: brightness(1.4);
    }
    .btn-apri.sending { box-shadow: 0 0 25px rgba(16, 185, 129, 0.6); }
    .btn-chiudi.sending { box-shadow: 0 0 25px rgba(239, 68, 68, 0.6); }

    .btn-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .btn-text .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .btn-text .subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .icon-box-lg {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }

    /* Single Commands (COMPACT & DISCREET) */
    .section-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
      padding-left: 4px;
    }

    .singles-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-single-compact {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-single-compact span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
    }

    .btn-single-compact .icon {
      width: 18px;
      height: 18px;
    }

    .btn-single-compact.sending {
      transform: scale(0.94);
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
      background: rgba(59, 130, 246, 0.15);
    }

  </style>
</head>
<body>

  <div class="app-container">

    <!-- Header Centrato -->
    <div class="header-center">
      <svg class="tesla-logo" viewBox="0 0 342 342" fill="none">
        <path fill="#e82127" d="M171 0C25.4 0 0 11.2 0 11.2l18.6 23.6s28.1-7.2 60.9-8.4c33.9-1.2 63.8 11.3 63.8 11.3l27.7 89.2 27.7-89.2s29.9-12.5 63.8-11.3c32.8 1.2 60.9 8.4 60.9 8.4l18.6-23.6S316.6 0 171 0zm-87.6 142.1l22.4 72.1 65.2 78.4 65.2-78.4 22.4-72.1s-19.6-7.8-49.3-7.8c-23.6 0-38.3 8.3-38.3 8.3L171 206l-20-63.4s-14.7-8.3-38.3-8.3c-29.7 0-49.3 7.8-49.3 7.8z"/>
      </svg>
      <div class="car-title">Flashblack</div>
    </div>

    <!-- Widget Panel Ingrandito -->
    <div class="widget-panel">
      <div class="widget-time-block">
        <span id="clock" class="widget-time">--:--</span>
        <span id="date" class="widget-date">--- -- ---</span>
      </div>
      <div class="widget-weather" id="weather">
        <span>🌦️</span> <strong id="temp">--°C</strong>
      </div>
    </div>

    <!-- Scenari Automatici (PRINCIPALI) -->
    <div class="scenarios-grid">
      <button class="btn-scenario btn-apri" onclick="inviaComando(this, URL_SCENARIO_APRI, '#10b981')">
        <div class="icon-box-lg">
          <svg style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
        </div>
        <div class="btn-text">
          <span class="title">APRI BOX</span>
          <span class="subtitle">Disattiva allarme, luce ON, apri basculante</span>
        </div>
      </button>

      <button class="btn-scenario btn-chiudi" onclick="inviaComando(this, URL_SCENARIO_CHIUDI, '#ef4444')">
        <div class="icon-box-lg">
          <svg style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <div class="btn-text">
          <span class="title">CHIUDI BOX</span>
          <span class="subtitle">Luce OFF, chiudi basculante, attiva allarme</span>
        </div>
      </button>
    </div>

    <!-- Comandi Singoli (COMPATTI) -->
    <div>
      <div class="section-label">Comandi Manuali</div>
      <div class="singles-row">
        <button class="btn-single-compact" onclick="inviaComando(this, URL_LUCE_BOX, '#f59e0b')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
          <span>Luce</span>
        </button>

        <button class="btn-single-compact" onclick="inviaComando(this, URL_BASCULANTE_BOX, '#3b82f6')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Basculante</span>
        </button>

        <button class="btn-single-compact" onclick="inviaComando(this, URL_ALLARME_ON, '#ef4444')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>On Furto</span>
        </button>

        <button class="btn-single-compact" onclick="inviaComando(this, URL_ALLARME_OFF, '#10b981')">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
          <span>Off Furto</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    // --- LINK SCENARI ---
    const URL_SCENARIO_APRI   = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=f024dd63-c921-4786-9652-bf02d9ee44d4&token=0aaf39c0-ddb9-4ad1-b617-4b2725c474a8&response=html";
    const URL_SCENARIO_CHIUDI = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=ceed55de-d0ca-417d-aa2b-e05ff2e4bc32&token=5e1e1179-d8a6-4837-ae6b-fd22596e01ee&response=html";

    // --- LINK COMANDI SINGOLI ---
    const URL_LUCE_BOX       = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=67f866e7-72f0-4c6e-b1ed-dfca06733806&token=f65f88a7-dec4-4d25-a1f3-692f08934014&response=html";
    const URL_BASCULANTE_BOX = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=2d069424-9826-4239-9313-5a18954de579&token=0bc3386d-f881-4afb-8bbf-04d5b0aac0e0&response=html";
    const URL_ALLARME_ON     = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=030c1432-8458-49c8-adbf-4e21bdd952c8&token=2dc25059-1f32-4547-9af1-fb98e95d58b9&response=html";
    const URL_ALLARME_OFF    = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=62e856b9-0d18-4742-b4e4-da03914f7731&token=3ee367a1-52f5-4d5b-946e-93cc5fa08206&response=html";

    function inviaComando(element, url, colorHex) {
      // Effetto Pulsazione Tasto e Flash Schermo
      element.classList.add('sending');
      document.body.style.setProperty('--flash-color', colorHex);
      document.body.classList.add('flash-active');

      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = url + "&_t=" + new Date().getTime();
      document.body.appendChild(iframe);

      setTimeout(() => {
        document.body.removeChild(iframe);
        element.classList.remove('sending');
        document.body.classList.remove('flash-active');
      }, 1500);
    }

    // --- OROLOGIO E DATA ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;

      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('date').innerText = now.toLocaleDateString('it-IT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- METEO AUTOMATICO (Mediglia) ---
    async function fetchWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.397&longitude=9.332&current_weather=true');
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅';
        else if (code >= 45 && code <= 48) icon = '🌫️';
        else if (code >= 51 && code <= 67) icon = '🌧️';
        else if (code >= 71) icon = '❄️';
        else if (code >= 95) icon = '⛈️';

        document.getElementById('weather').innerHTML = `<span>${icon}</span> <strong>${temp}°C</strong>`;
      } catch (e) {
        document.getElementById('weather').innerText = '';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);
  </script>

</body>
</html>
