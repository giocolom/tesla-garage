<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flashblack Command Center</title>
  <style>
    :root {
      --bg-color: #080a0f;
      --card-bg: rgba(18, 22, 33, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --tesla-red: #e82127;
      --accent-green: #10b981;
      --accent-green-bg: rgba(16, 185, 129, 0.12);
      --accent-red: #ef4444;
      --accent-red-bg: rgba(239, 68, 68, 0.12);
      --accent-amber: #f59e0b;
      --accent-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #131725 0%, #080a0f 65%);
      color: var(--text-main);
      font-family: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Centered Header */
    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    .tesla-logo {
      width: 38px;
      height: 38px;
      color: var(--tesla-red);
      filter: drop-shadow(0 0 10px rgba(232, 33, 39, 0.4));
    }

    .car-title {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.2px;
      color: #ffffff;
    }

    /* Widget Bar Pill */
    .widget-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 8px 18px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .widget-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .widget-item strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .divider {
      width: 1px;
      height: 14px;
      background-color: var(--card-border);
    }

    /* Section Titles */
    .section-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
      padding-left: 6px;
    }

    /* Scenari Macro */
    .scenarios-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-scenario {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .btn-scenario::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 4px 0 0 4px;
    }

    .btn-apri {
      background: linear-gradient(90deg, var(--accent-green-bg) 0%, var(--card-bg) 100%);
    }
    .btn-apri::before { background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }

    .btn-chiudi {
      background: linear-gradient(90deg, var(--accent-red-bg) 0%, var(--card-bg) 100%);
    }
    .btn-chiudi::before { background-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }

    .btn-scenario:active {
      transform: scale(0.97);
      border-color: var(--card-hover);
    }

    .btn-text {
      display: flex;
      flex-direction: column;
      text-align: left;
    }

    .btn-text .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
    }

    .btn-text .subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Comandi Singoli */
    .singles-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-single {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .btn-single span {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .btn-single:active {
      transform: scale(0.95);
      border-color: var(--accent-blue);
      background: rgba(59, 130, 246, 0.12);
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .icon {
      width: 24px;
      height: 24px;
    }

    /* Status Div */
    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 50px;
      padding: 10px 20px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .status-card.success {
      color: var(--accent-green);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- Header Centrato -->
    <div class="header-center">
      <!-- Vettore Tesla accurato -->
      <svg class="tesla-logo" viewBox="0 0 100 100" fill="currentColor">
        <path d="M50 12c-15 0-28 2.2-37 6.5l4 12c9-4 20.5-5.5 33-5.5s24 1.5 33 5.5l4-12c-9-4.3-22-6.5-37-6.5zm0 19.5c-11 0-19 2-24 4.5l11 47L50 37l13 46 11-47c-5-2.5-13-4.5-24-4.5z"/>
      </svg>
      <div class="car-title">Flashblack</div>
    </div>

    <!-- Widget Bar Pill -->
    <div class="widget-bar">
      <div class="widget-item">
        <strong id="clock">--:--</strong>
      </div>
      <div class="divider"></div>
      <div class="widget-item" id="date">
        --- -- ---
      </div>
      <div class="divider"></div>
      <div class="widget-item" id="weather">
        <span>🌦️</span> <strong id="temp">--°C</strong>
      </div>
    </div>

    <!-- Scenari Automatici -->
    <div>
      <div class="section-label">Automazioni Box</div>
      <div class="scenarios-grid">
        <button class="btn-scenario btn-apri" onclick="inviaComando(URL_SCENARIO_APRI, 'Scenario APRI BOX')">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
          </div>
          <div class="btn-text">
            <span class="title">APRI BOX</span>
            <span class="subtitle">Disattiva allarme, luce ON, apre basculante</span>
          </div>
        </button>

        <button class="btn-scenario btn-chiudi" onclick="inviaComando(URL_SCENARIO_CHIUDI, 'Scenario CHIUDI BOX')">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          </div>
          <div class="btn-text">
            <span class="title">CHIUDI BOX</span>
            <span class="subtitle">Luce OFF, chiude basculante, attiva allarme</span>
          </div>
        </button>
      </div>
    </div>

    <!-- Comandi Singoli -->
    <div>
      <div class="section-label">Comandi Singoli</div>
      <div class="singles-grid">
        <button class="btn-single" onclick="inviaComando(URL_LUCE_BOX, 'Luce Box')">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
          </div>
          <span>Luce Box</span>
        </button>

        <button class="btn-single" onclick="inviaComando(URL_BASCULANTE_BOX, 'Basculante')">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          </div>
          <span>Basculante</span>
        </button>

        <button class="btn-single" onclick="inviaComando(URL_ALLARME_ON, 'Attiva Allarme')">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          </div>
          <span>Attiva Allarme</span>
        </button>

        <button class="btn-single" onclick="inviaComando(URL_ALLARME_OFF, 'Disattiva Allarme')">
          <div class="icon-box">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
          </div>
          <span>Disattiva Allarme</span>
        </button>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status" class="status-card">Pronto</div>
  </div>

  <script>
    // --- LINK SCENARI ---
    const URL_SCENARIO_APRI   = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=f024dd63-c921-4786-9652-bf02d9ee44d4&token=0aaf39c0-ddb9-4ad1-b617-4b2725c474a8&response=html";
    const URL_SCENARIO_CHIUDI = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=ceed55de-d0ca-417d-aa2b-e05ff2e4bc32&token=5e1e1179-d8a6-4837-ae6b-fd22596e01ee&response=html";

    // --- LINK COMANDI SINGOLI ---
    const URL_LUCE_BOX       = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=67f866e7-72f0-4c6e-b1ed-dfca06733806&token=f65f88a7-dec4-4d25-a1f3-692f08934014&response=html";
    const URL_BASCULANTE_BOX = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=2d069424-9826-4239-9313-5a18954de579&token=0bc3386d-f881-4afb-8bbf-04d5b0aac0e0&response=html";
    const URL_ALLARME_ON     = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=030c1432-8458-49c8-adbf-4e21bdd952c8&token=2dc25059-1f32-4547-9af1-fb98e95d58b9&response=html";
    const URL_ALLARME_OFF    = "https://www.virtualsmarthome.xyz/url_routine_trigger/activate.php?trigger=62e856b9-0d18-4742-b4e4-da03914f7731&token=3ee367a1-52f5-4d5b-946e-93cc5fa08206&response=html";

    function inviaComando(url, nomeComando) {
      const statusDiv = document.getElementById("status");
      statusDiv.className = "status-card";
      statusDiv.innerText = "Inviando: " + nomeComando + "...";

      const iframe = document.createElement("iframe");
      iframe.style.display = "none";
      iframe.src = url + "&_t=" + new Date().getTime();
      document.body.appendChild(iframe);

      setTimeout(() => {
        statusDiv.className = "status-card success";
        statusDiv.innerText = "✓ " + nomeComando + " eseguito";
        
        setTimeout(() => {
          document.body.removeChild(iframe);
          statusDiv.className = "status-card";
          statusDiv.innerText = "Pronto";
        }, 2000);
      }, 800);
    }

    // --- OROLOGIO E DATA ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}`;

      const options = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('date').innerText = now.toLocaleDateString('it-IT', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- METEO AUTOMATICO (Mediglia) ---
    async function fetchWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=45.397&longitude=9.332&current_weather=true');
        const data = await response.json();
        const temp = Math.round(data.current_weather.temperature);
        const code = data.current_weather.weathercode;

        let icon = '☀️';
        if (code >= 1 && code <= 3) icon = '⛅';
        else if (code >= 45 && code <= 48) icon = '🌫️';
        else if (code >= 51 && code <= 67) icon = '🌧️';
        else if (code >= 71) icon = '❄️';
        else if (code >= 95) icon = '⛈️';

        document.getElementById('weather').innerHTML = `<span>${icon}</span> <strong>${temp}°C</strong>`;
      } catch (e) {
        document.getElementById('weather').innerText = '';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);
  </script>

</body>
</html>
